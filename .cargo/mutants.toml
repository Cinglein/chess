exclude_globs = [
    "crates/*/src/main.rs",
    "tooling/*/src/main.rs",
    "tooling/accept_ports/**",
    "tooling/report_ports/**",
    "crates/*/src/command_line/**",
    "crates/chess/**",
    "crates/tui/**",
    "crates/board/src/slider/bits/magics.rs",
    "crates/eval/src/piece_square_tables/placement_table.rs",
]
exclude_re = [
    "arbitrary_with",
    "<impl Drop for UciProcess>::drop",
    "Network::trainer",
    "MagicTables::write",
    "MagicTables::find_all",
    "MagicSearch::spreads_well",
    "<impl Iterator for XorShift>::next",
    "XorShift::sparse",
]
minimum_test_timeout = 10.0
test_workspace = true
cap_lints = false
