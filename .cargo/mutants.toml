exclude_globs = [
    "xtask/**",
    "crates/*/src/main.rs",
    "crates/chess/**",
    "crates/tui/**",
    "crates/arena/src/command_line/**",
    "crates/datagen/src/command_line/**",
    "crates/trainer/src/command_line/**",
    "crates/board/src/board/playout.rs",
    "crates/board/src/slider/magics.rs",
    "crates/eval/src/piece_square_tables/placement_table.rs",
]
exclude_re = [
    "arbitrary_with",
    "MutantCosts::measure",
    "<impl Drop for UciProcess>::drop",
    "Network::trainer",
    "Stacked::",
    "TestBinary::discover",
    "TestBinary::timings",
    "TestBinary::tests",
    "TestTime::run",
    "Affected::run",
    "Affected::loads",
    "Changes::reaches",
    "Magics::run",
    "MagicTables::write",
    "MagicTables::find_all",
    "<impl Iterator for XorShift>::next",
    "XorShift::sparse",
    "Mutants::run",
    "Mutants::refuse_if_another_run_exists",
    "Mutants::refuse_if_memory_is_short",
    "MutantsRun::accepted",
    "MemoryWatch::sample",
    "MemoryWatch::enforce",
    "MemoryWatch::grown",
    "MemoryWatch::children_outside",
]
additional_cargo_args = ["--lib"]
minimum_test_timeout = 10.0
cap_lints = false
