[package]
name = "datagen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
arena = { version = "0.1.0", path = "../arena" }
board = { version = "0.1.0", path = "../board", features = ["serde"] }
bulletformat = "1.8.0"
clap = { version = "4", features = ["derive"] }
derive_more = { version = "2", features = ["add", "display"] }
eval = { version = "0.1.0", path = "../eval" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.9"

[dev-dependencies]
board = { version = "0.1.0", path = "../board", features = ["proptest", "serde"] }
eval = { version = "0.1.0", path = "../eval", features = ["proptest"] }
proptest = "1"

[lints]
workspace = true
