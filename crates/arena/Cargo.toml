[package]
name = "arena"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
settings = { package = "chess_settings", version = "0.1.0", path = "../settings" }
board = { version = "0.1.0", path = "../board", features = ["serde"] }
enum-map = "3"
rand = "0.10"
eval = { version = "0.1.0", path = "../eval", features = ["serde"] }
game = { version = "0.1.0", path = "../game" }
opponent_ports = { version = "0.1.0", path = "../opponent_ports" }
serde = { version = "1", features = ["derive"] }
derive_more = { version = "2", features = ["add", "display", "from", "from_str", "into", "sum"] }
thiserror = "2"
toml = "0.9"
tally = { version = "0.1.0", path = "../tally" }
strum = { version = "0.28", default-features = false, features = ["derive"] }
uci = { version = "0.1.0", path = "../uci", features = ["serde"] }

[lints]
workspace = true
