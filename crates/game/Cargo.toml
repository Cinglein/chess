[package]
name = "game"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
board = { version = "0.1.0", path = "../board", features = ["serde"] }
derive_more = { version = "2", features = ["add", "display", "from_str", "sum"] }
enum-map = "3"
eval = { version = "0.1.0", path = "../eval", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
strum = { version = "0.28", default-features = false, features = ["derive"] }
tally = { version = "0.1.0", path = "../tally" }
thiserror = "2"
uci = { version = "0.1.0", path = "../uci", features = ["serde"] }

[dev-dependencies]
opponent_ports = { version = "0.1.0", path = "../opponent_ports" }

[lints]
workspace = true
