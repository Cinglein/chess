[package]
name = "arena_cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "arena"
path = "src/main.rs"

[dependencies]
arena = { version = "0.1.0", path = "../arena" }
clap = { version = "4", features = ["derive"] }
game = { version = "0.1.0", path = "../game" }
opponent_ports = { version = "0.1.0", path = "../opponent_ports" }
settings = { package = "chess_settings", version = "0.1.0", path = "../settings" }
thiserror = "2"
uci = { version = "0.1.0", path = "../uci" }

[lints]
workspace = true
