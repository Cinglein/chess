[package]
name = "trainer_schedule"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
derive_more = { version = "2", features = ["display"] }
eval = { version = "0.1.0", path = "../eval" }
serde = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
bullet_lib = { git = "https://github.com/jw1912/bullet", rev = "c004ebf04025edf91c6ccac47e72d561062a46b5", features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
bullet_lib = { git = "https://github.com/jw1912/bullet", rev = "c004ebf04025edf91c6ccac47e72d561062a46b5" }

[dev-dependencies]
toml = "0.9"

[lints]
workspace = true
