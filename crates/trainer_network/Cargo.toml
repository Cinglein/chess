[package]
name = "trainer_network"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
eval = { version = "0.1.0", path = "../eval" }
strum = { version = "0.28", default-features = false, features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
bullet_lib = { git = "https://github.com/jw1912/bullet", rev = "c004ebf04025edf91c6ccac47e72d561062a46b5", features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
bullet_lib = { git = "https://github.com/jw1912/bullet", rev = "c004ebf04025edf91c6ccac47e72d561062a46b5" }

[lints]
workspace = true
