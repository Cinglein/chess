[package]
name = "uci_response"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
board = { version = "0.1.0", path = "../board" }
eval = { version = "0.1.0", path = "../eval" }
proptest = { version = "1", optional = true }
search = { version = "0.1.0", path = "../search" }
strum = { version = "0.28", default-features = false, features = ["derive"] }
thiserror = { version = "2", default-features = false }

[features]
proptest = ["dep:proptest", "board/proptest", "eval/proptest", "search/proptest"]

[lints]
workspace = true

[dev-dependencies]
board = { version = "0.1.0", path = "../board", features = ["proptest"] }
eval = { version = "0.1.0", path = "../eval", features = ["proptest"] }
proptest = "1"
search = { version = "0.1.0", path = "../search", features = ["proptest"] }
