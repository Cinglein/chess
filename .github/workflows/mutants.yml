name: Mutants

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: mutants-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 4

jobs:
  affected:
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - id: plan
        run: echo "plan=$(cargo xtask affected)" >> "$GITHUB_OUTPUT"

  full:
    needs: affected
    if: fromJSON(needs.affected.outputs.plan).jobs.full != null && fromJSON(needs.affected.outputs.plan).jobs.full.shard_count > 0
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.affected.outputs.plan).jobs.full.shards }}
    env:
      MUTANTS_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: mutants-workspace
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - run: cargo xtask mutants-full
        env:
          CARGO_INCREMENTAL: 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-${{ strategy.job-index }}
          path: target/mutants/mutants.out

  mutants-gate:
    needs: [affected, full]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE_TITLE: Surviving mutants on main
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - id: verdict
        run: |
          if echo '${{ toJSON(needs) }}' | grep -qE '"result": "(failure|cancelled)"'; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          pattern: mutants-*
          path: shards
      - id: issue
        if: github.ref == 'refs/heads/main'
        run: |
          open=$(gh issue list --state open --json number,title --jq "first(.[] | select(.title == \"$ISSUE_TITLE\") | .number)")
          echo "number=$open" >> "$GITHUB_OUTPUT"
      - if: github.ref == 'refs/heads/main' && steps.verdict.outputs.failed == 'true'
        env:
          ISSUE: ${{ steps.issue.outputs.number }}
        run: |
          { echo "Run: $RUN_URL"; echo; echo '```'; find shards -name missed.txt -exec cat {} + 2>/dev/null | sort -u; echo '```'; } > body.md
          if [ -n "$ISSUE" ]; then
            gh issue edit "$ISSUE" --body-file body.md
            gh issue comment "$ISSUE" --body "Still failing: $RUN_URL"
          else
            gh issue create --title "$ISSUE_TITLE" --body-file body.md
          fi
      - if: github.ref == 'refs/heads/main' && steps.verdict.outputs.failed == 'false' && steps.issue.outputs.number != ''
        env:
          ISSUE: ${{ steps.issue.outputs.number }}
        run: gh issue close "$ISSUE" --comment "Green again: $RUN_URL"
      - if: steps.verdict.outputs.failed == 'true'
        run: exit 1
      - run: echo "every shard passed or none was needed"
