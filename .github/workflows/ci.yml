name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 4
  LINT_REVISION: 0c69ba4e8022b7d4eb1af9d92be8179c243c3058
  MUTANT_SHARDS: 4

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint-runner
      - run: cargo +1.99.0 install --locked --git https://github.com/Studio-Terza/meta-dev --rev "$LINT_REVISION" lint
      - run: lint .

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --target wasm32-unknown-unknown -p board -p eval -p fen -p go_limits -p search -p uci -p uci_response -- -D warnings

  mutants:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: mutants
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      - run: git diff HEAD^1 HEAD -- '*.rs' > "$RUNNER_TEMP/changed.diff"
      - name: mutants in changed lines
        env:
          CARGO_INCREMENTAL: 1
          SHARD: ${{ matrix.shard }}/${{ env.MUTANT_SHARDS }}
        run: |
          status=0
          cargo mutants --in-diff "$RUNNER_TEMP/changed.diff" --shard "$SHARD" --output "$RUNNER_TEMP" --colors never || status=$?
          missed="$RUNNER_TEMP/mutants.out/missed.txt"
          if [ -s "$missed" ]; then
            { echo '### Missed mutants'; echo '```'; cat "$missed"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            sed 's/^/::error::missed mutant: /' "$missed"
            exit 2
          fi
          if [ "$status" -eq 3 ] && [ -f "$missed" ]; then exit 0; fi
          exit "$status"

  ci-gate:
    needs: [ci, lint, wasm, mutants]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo '${{ toJSON(needs) }}' | grep -qE '"result": "(failure|cancelled)"' && exit 1
          echo "every job passed or was not needed"
