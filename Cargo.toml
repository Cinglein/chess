[workspace]
resolver = "3"
members = [
    "crates/*",
    "tooling/affected",
    "tooling/lints/*",
    "tooling/magics",
    "tooling/mutant_costs",
    "tooling/mutation",
    "tooling/stacked",
    "tooling/task",
    "tooling/test_time",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/Cinglein/chess"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.test]
opt-level = 2
debug = "line-tables-only"

[profile.test.package.const_shape]
opt-level = 0

[profile.test.package.distinct_signatures]
opt-level = 0

[profile.test.package.expression_flow]
opt-level = 0

[profile.test.package.fn_shape]
opt-level = 0

[profile.test.package.literal_names]
opt-level = 0

[profile.test.package.manual_iteration]
opt-level = 0

[profile.test.package.module_nesting]
opt-level = 0

[profile.test.package.named_lifetimes]
opt-level = 0

[profile.test.package.named_numbers]
opt-level = 0

[profile.test.package.no_comments]
opt-level = 0

[profile.test.package.no_forwarders]
opt-level = 0

[profile.test.package.no_free_fns]
opt-level = 0

[profile.test.package.no_numbers_in_binaries]
opt-level = 0

[profile.test.package.no_parameter_bags]
opt-level = 0

[profile.test.package.primitive_boundary]
opt-level = 0

[profile.test.package.private_fns]
opt-level = 0

[profile.test.package.public_surface]
opt-level = 0

[profile.test.package.settings_shape]
opt-level = 0

[profile.test.package.state_graph]
opt-level = 0

[profile.test.package.test_budget]
opt-level = 0

[profile.test.package.type_shape]
opt-level = 0

[profile.test.package.affected]
opt-level = 0

[profile.test.package.magics]
opt-level = 0

[profile.test.package.mutant_costs]
opt-level = 0

[profile.test.package.mutation]
opt-level = 0

[profile.test.package.stacked]
opt-level = 0

[profile.test.package.task]
opt-level = 0

[profile.test.package.test_time]
opt-level = 0

[profile.test.package.xtask]
opt-level = 0

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
