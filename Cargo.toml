[workspace]
resolver = "3"
members = [
    "crates/*",
    "tooling/magics",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/Cinglein/chess"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.test]
opt-level = 2
debug = "line-tables-only"

[profile.test.package.magics]
opt-level = 0

[profile.test.package.xtask]
opt-level = 0

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
