vague = [
    "with", "from", "into", "for", "get", "set", "make", "check", "build", "create", "init",
    "process", "handle", "helper", "util", "data", "value", "item", "thing", "execute",
    "perform", "update", "compute", "manage",
]
wire_types = [
    "serde_json::Value",
    "toml::Value",
    "serde_yaml::Value",
    "rust_decimal::Decimal",
    "bigdecimal::BigDecimal",
    "num_bigint::BigInt",
    "num_bigint::BigUint",
    "std::any::Any",
    "core::any::Any",
]

bit_boundary = [
    "crates/board/src/square/",
    "crates/board/src/bitboard/",
    "crates/board/src/direction.rs",
    "crates/board/src/slider/magic.rs",
    "crates/board/src/slider/magics.rs",
    "crates/board/src/slider/attack_table.rs",
    "crates/board/src/zobrist_keys/split_mix.rs",
    "tooling/magics/src/",
]
gate = "local-gate"
gate_wait = 600000
gate_env = []
surfaces = [
    "xtask",
    ".cargo",
    "Cargo.toml",
    "clippy.toml",
    ".clippy.toml",
    "rustfmt.toml",
    ".rustfmt.toml",
    "rust-toolchain",
    "rust-toolchain.toml",
    "tooling",
    "tooling/lint-baseline.toml",
    "meta.toml",
    ".claude",
    ".github",
]

[branches]
default = "main"
base = "origin/main"

[limits]
parameters = 4
nesting = 2
reexports = 8
private_fns_per_type = 4
edges_per_vertex = 4
tests_per_file = 3
assertions_per_test = 3
lines_per_test = 20
literals_per_test = 4
largest_integer = 64
slowest_shown = 5

[floors]
fn_name = 3
lifetime_name = 2
cut_side = 5
price_sample = 30
diff_factor = 3

[shares]
tests_per_hundred_files = 40
cut_conductance = 19
shard_headroom = 60

[memory_gib]
granted = 8
reserve = 1
per_compiler_task = 2
for_the_tests = 2

[millis]
sample_every = 20
discover_every = 100
per_crate = 15000
test_timeout = 30000
job_setup = 90000

[mutation]
full_run = ["every_main_push", "weekly", "on_demand"]

[domains.features-and-maintenance]
crates = ["*"]
paths = ["*"]

[domains.performance-and-cost]
tests = ["*"]
workflows = ["*"]

[budgets.test-time]
division = "performance-and-cost"
measure = "test_wall_time"
allowance = { duration = 4000 }
window = "per_change"
source = "ci"

[budgets.slowest-test]
division = "performance-and-cost"
measure = "slowest_test"
allowance = { duration = 1000 }
window = "per_change"
source = "ci"

[budgets.mutants-full-job]
division = "performance-and-cost"
measure = { workflow_wall_time = "full_job" }
allowance = { duration = 480000 }
window = "per_change"
source = "ci"

[budgets.mutants-diff-job]
division = "performance-and-cost"
measure = { workflow_wall_time = "diff_job" }
allowance = { duration = 360000 }
window = "per_change"
source = "ci"

[budgets.mutant-price]
division = "performance-and-cost"
measure = "mutant_price"
allowance = { share = 100 }
tolerance = 25
window = "per_change"
source = "ci"

[budgets.lint-findings]
division = "features-and-maintenance"
measure = "lint_findings"
allowance = { baseline = "tooling/lint-baseline.toml" }
window = "per_change"
source = "ci"

[budgets.test-line-share]
division = "features-and-maintenance"
measure = "test_line_share"
allowance = { share = 18 }
window = "per_change"
source = "ci"

[budgets.tangle-items]
division = "features-and-maintenance"
measure = "tangle_items"
allowance = { count = 83 }
window = "per_change"
source = "ci"

[mutant_millis]
default = 2500

[mutant_millis.crates]
arena = 1200
board = 2500
datagen = 900
engine = 4800
eval = 2100
fen = 4400
magics = 8400
search = 2200
chess_settings = 10600
trainer = 400
uci = 6900
